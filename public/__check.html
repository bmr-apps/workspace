<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 화면 점검 (임시)</title>
<style>
  body { margin: 0; background: #ddd; font-family: sans-serif; display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; margin-bottom: 4px; }
  iframe { border: 2px solid #000; background: #fff; display: block; }
</style>
</head>
<body>
  <figure>
    <figcaption>390 × 844 (아이폰/갤럭시 일반)</figcaption>
    <iframe src="/workspace/?v=7" width="390" height="844" title="390 화면"></iframe>
  </figure>
  <figure>
    <figcaption>360 × 640 (작은 화면)</figcaption>
    <iframe src="/workspace/?v=7" width="360" height="640" title="360 화면"></iframe>
  </figure>
</body>
</html>
